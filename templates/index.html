<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f5f5f5;
        }
        .container {
            background: #1c1c1c;
            width: 100%;
            max-width: 420px;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #2a2a2a;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #ffffff;
            letter-spacing: 1px;
        }
        form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 14px;
            background: #000;
            color: #fff;
        }
        input[type="text"]::placeholder {
            color: #777;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #fff;
        }
        button {
            padding: 12px 18px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s ease, color 0.2s ease;
        }
        button:hover {
            background: #e0e0e0;
            color: #000;
        }
        h2 {
            margin-bottom: 12px;
            color: #cccccc;
            font-size: 18px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 12px 14px;
            background: #000000;
            border: 1px solid #333;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #f0f0f0;
        }
        li.empty {
            text-align: center;
            color: #777;
            background: transparent;
            border: 1px dashed #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Todo App</h1>

        <form method="post">
            <input type="text" name="message" placeholder="Add a new task" required>
            <button type="submit">Add</button>
        </form>

        <h2>Your Tasks</h2>
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% else %}
                <li class="empty">No tasks yet.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
